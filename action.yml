name: 'Arborist'
description: 'Programmatic branch protection for GitHub repositories'
inputs:
  token:
    description: 'GitHub token with repository administration and branch protection permissions'
    required: true
  branches:
    description: 'Branches to protect provided as a JSON array'
    required: true
    default: '["main", "feedback"]'
  required-checks:
    description: 'JSON mapping of branch names to required status check contexts, e.g. {"main": ["ci/test"]}'
    required: false
    default: '{}'
    type: string
  min-approvals:
    description: 'Minimum number of approving reviews required for protected branches'
    required: true
    default: 1
    type: number
  team-roles:
    description: 'JSON mapping of team slugs to repository permission levels, e.g. {"staff": "maintain"}'
    required: false
    default: '{}'
    type: string
  enforce-admins:
    description: 'Require status checks to pass before merging even for administrators'
    required: true
    default: false
    type: boolean
  force-protect:
    description: 'Force branch protection regardless of template/assignment status'
    required: false
    default: false
    type: boolean
runs:
  using: 'node22'
  main: 'dist/index.js'
